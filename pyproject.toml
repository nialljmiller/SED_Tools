[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sed-tools"
version = "0.4.1"
description = "Programmatic access to SED Tools stellar spectral grids and photometry helpers."
readme = "README.md"
authors = [{ name = "Niall Miller" }]
requires-python = ">=3.10"
keywords = ["astronomy", "spectra", "photometry", "sed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=1.5",
    "tqdm>=4.66",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "h5py>=3.10",
    "astropy>=6.1",
    "astroquery>=0.4.7",
    "matplotlib>=3.7",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
full = [
    "scipy>=1.14",
    "xlrd>=2.0",  # Keck NIRC2/LRIS filter workbooks (original-source builders)
    "scikit-learn",
    "torch",
    "dust_extinction>=1.6",
    ]
# A(lambda)/A(V) (AfAv) in sed_tools.filter_properties: the Fitzpatrick (1999) law.
extinction = ["dust_extinction>=1.6"]

[project.urls]
"Homepage" = "https://github.com/nialljmiller/SED_Tools"

[tool.setuptools.packages.find]
include = ["sed_tools*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
sed_tools = ["sed_tools.defaults", "cie/*.csv"]

[project.scripts]
sed-tools = "sed_tools.cli:main"
